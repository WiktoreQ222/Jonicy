<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>16 urodziny – Mateo i Krzychu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#0b0b0c;--card:#131314;--text:#ece8df;--muted:#8d8a83;--gold:#c9a96a;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
#dust{position:fixed;inset:0;pointer-events:none;z-index:0}
.hero{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
.frame{position:relative;width:100%;max-width:760px;padding:clamp(36px,8vw,64px) clamp(20px,6vw,56px) clamp(30px,6vw,48px);border:1px solid var(--gold);text-align:center;background:linear-gradient(#0f0f10,#0b0b0c)}
.frame::before{content:"";position:absolute;inset:8px;border:1px solid #c9a96a55;pointer-events:none}
.frame i{position:absolute;width:14px;height:14px;border:1px solid var(--gold);background:var(--bg);transform:rotate(45deg)}
.frame i:nth-of-type(1){top:-8px;left:calc(50% - 7px)}.frame i:nth-of-type(2){bottom:-8px;left:calc(50% - 7px)}
.kicker{font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin:0 0 18px}
h1{font:500 clamp(30px,7.5vw,60px)/1.1 var(--serif);margin:0;letter-spacing:.01em}
h1 em{display:block;font-style:italic;color:var(--gold);font-size:1.15em;margin-top:4px}
.names{font:italic 500 clamp(18px,4.5vw,26px) var(--serif);color:var(--muted);margin:16px 0 0}
.rule{width:80px;height:1px;background:var(--gold);margin:26px auto 0}
.hint{position:absolute;bottom:14px;left:0;right:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);animation:bob 2.2s ease-in-out infinite}
/* CAKE */
.cake{position:relative;width:190px;height:178px;margin:26px auto 0;animation:float 4s ease-in-out infinite}
.tier{position:absolute;left:50%;transform:translateX(-50%);background:#141414;border:1px solid var(--gold);border-bottom-width:2px}
.tier::before{content:"";position:absolute;top:0;left:0;right:0;height:11px;border-bottom:1px solid #c9a96a88;background:repeating-linear-gradient(90deg,#c9a96a22 0 8px,transparent 8px 16px)}
.t1{bottom:0;width:190px;height:56px}.t2{bottom:56px;width:136px;height:48px}.t3{bottom:104px;width:88px;height:40px}
.candle{position:absolute;bottom:144px;width:5px;height:24px;background:var(--text)}
.flame{position:absolute;top:-16px;left:-3px;width:11px;height:16px;background:radial-gradient(circle at 50% 70%,#fff4c4,#e8a53a 60%,transparent 70%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;box-shadow:0 0 14px 3px #e8a53a66;animation:flicker .35s ease-in-out infinite alternate}
/* CARDS */
.twins{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:70px 20px 90px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.twins .head{grid-column:1/-1;text-align:center;margin-bottom:10px}
.head h2{font:500 clamp(28px,6vw,42px) var(--serif);margin:0}
.head p{color:var(--muted);margin:8px 0 0;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.card{position:relative;aspect-ratio:3/4;display:flex;align-items:flex-end;padding:22px;color:inherit;text-decoration:none;background:var(--card);border:1px solid #2a2a2a;transition:transform .3s,border-color .3s}
.card::before{content:"";position:absolute;inset:7px;border:1px solid #ffffff10;transition:border-color .3s}
.card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:italic 500 120px var(--serif);color:#ffffff0c}
.card b{position:relative;display:block;font:700 clamp(24px,5.5vw,34px) var(--serif)}
.card small{position:relative;display:block;margin-top:4px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:var(--gold);outline:none}
.card:hover::before{border-color:#c9a96a66}
/* WISHES */
#wishes{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px));display:none}
#wishes.on{display:block;animation:fade .5s}
.wrap{max-width:660px;margin:0 auto}
.back{background:none;border:1px solid #333;color:var(--text);padding:8px 18px;font:13px var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.back:hover{border-color:var(--ac)}
.letter{position:relative;margin-top:26px;padding:clamp(28px,7vw,52px) clamp(20px,6vw,46px);border:1px solid var(--ac);background:linear-gradient(#111,#0c0c0d)}
.letter::before{content:"";position:absolute;inset:7px;border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);pointer-events:none}
.letter h2{font:italic 500 clamp(30px,8vw,48px)/1.1 var(--serif);margin:0 0 22px;text-align:center}
.letter h2 span{color:var(--ac)}
.letter p{font:500 clamp(19px,4.6vw,24px)/1.55 var(--serif);margin:0 0 16px;opacity:0;transform:translateY(12px);animation:rise .8s forwards}
.sig{margin-top:26px;text-align:right;color:var(--muted);font:italic 500 20px var(--serif)}
@keyframes flicker{to{transform:scale(1.15,.9) rotate(4deg);opacity:.9}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes bob{50%{transform:translateY(5px)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{to{opacity:1;transform:none}}
@media(max-width:480px){.twins{gap:14px}.card{padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.letter p{opacity:1;transform:none}}

/* hero: wesoły, nie elegancki */
.hero .frame{border:3px solid var(--gold);border-radius:22px;background:radial-gradient(circle at 50% 0,#2a1536,#0b0b0c 70%);box-shadow:0 0 36px #ff5c8a33,inset 0 0 30px #ffc83d14}
.hero .frame::before{inset:9px;border:2px dashed #ff5c8a;border-radius:15px}
.hero .frame i{display:none}
.hero .kicker{font:800 14px var(--sans);letter-spacing:.3em;color:#6be7ff}
.hero h1{font:800 clamp(30px,8vw,62px)/1.08 var(--sans);letter-spacing:-.01em;text-transform:uppercase}
.hero h1 em{font:inherit;font-style:normal;background:linear-gradient(90deg,#ffc83d,#ff5c8a,#6be7ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite}
.hero .rule{height:4px;width:90px;border-radius:4px;background:linear-gradient(90deg,#ffc83d,#ff5c8a,#6be7ff)}
.hero .tier{border:2px solid #fff3;border-radius:10px 10px 4px 4px}
.hero .tier::before{height:14px;border:0;border-radius:0 0 14px 14px;background:#fff}
.hero .t1{background:#ff5c8a}.hero .t2{background:#ffc83d}.hero .t3{background:#6be7ff}
.hero .candle{background:#ff5c8a;border-radius:2px}
.hero .candle:nth-child(2){background:#ffc83d}.hero .candle:nth-child(3){background:#6be7ff}
.hero .hint{font:600 13px var(--sans);color:#ffc83d}
.art{display:grid;gap:12px;margin-top:20px}
.art img{width:100%;display:block;border:1px solid var(--ac);max-height:480px;object-fit:cover;object-position:top}
@keyframes hue{50%{filter:hue-rotate(60deg)}}
.full{margin-top:22px}
.bar{position:relative;z-index:1;text-align:center;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--gold);background:#000;color:var(--gold);font:600 13px var(--sans);letter-spacing:.28em;text-transform:uppercase}
.wrap .bar{margin:28px -18px calc(-40px - env(safe-area-inset-bottom,0px))}.full img{width:100%;height:auto;display:block;border:1px solid var(--ac)}
</style>
</head>
<body>
<canvas id="dust"></canvas>

<header class="hero">
  <div class="frame">
    <i></i><i></i>
    <p class="kicker">Mateo &amp; Krzychu</p>
    <h1>Wszystkiego najlepszego<em>z okazji 16 urodzin</em></h1>
    <div class="rule"></div>
    <div class="cake" aria-hidden="true">
      <div class="candle" style="left:68px"><i class="flame"></i></div>
      <div class="candle" style="left:92px"><i class="flame" style="animation-delay:.12s"></i></div>
      <div class="candle" style="left:116px"><i class="flame" style="animation-delay:.24s"></i></div>
      <div class="tier t3"></div><div class="tier t2"></div><div class="tier t1"></div>
    </div>
  </div>
  <div class="hint">Przewiń niżej</div>
</header>

<section class="twins">
  <div class="head"><h2>Życzenia</h2><p>Wybierz jubilata</p></div>
  <a class="card" href="#mateo" style="--ac:#b3202a"><span class="ph">M</span><div><b>Mateo</b><small>Zobacz życzenia</small></div></a>
  <a class="card" href="#krzychu" style="--ac:#b08d57"><span class="ph">K</span><div><b>Krzychu</b><small>Zobacz życzenia</small></div></a>
</section>

<footer class="bar">Od Wiktora</footer>

<div id="wishes"><div class="wrap">
  <button class="back" id="back">← Wróć</button>
  <div class="full" id="art"></div>
  <footer class="bar">Od Wiktora</footer>
</div></div>

const box = document.getElementById("wishes");
function show(k){
  const d = DATA[k]; if(!d) return hide();
  box.style.setProperty("--ac", d.accent);
  const art = document.getElementById("art"); art.textContent = "";
  const im = new Image(); im.src = d.img; im.alt = "Życzenia dla " + d.name; art.appendChild(im);
  box.classList.add("on"); box.scrollTop = 0;
}
function hide(){ box.classList.remove("on"); }
function route(){ const k = location.hash.slice(1); (k && DATA[k]) ? show(k) : hide(); }
addEventListener("hashchange", route);
document.getElementById("back").onclick = () => { location.hash = ""; hide(); };
route();

// konfetti
const c = document.getElementById("dust"), x = c.getContext("2d");
let W, H, P = [];
function size(){ W = c.width = innerWidth; H = c.height = innerHeight; }
size(); addEventListener("resize", size);
const cols=["#ffc83d","#ff5c8a","#6be7ff","#ffffff"];
for(let i=0;i<45;i++) P.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*3,v:.4+Math.random()*.9,d:Math.random()*6,c:cols[i%4]});
(function tick(){
  x.clearRect(0,0,W,H);
  P.forEach(p=>{ p.y+=p.v; p.d+=.01; p.x+=Math.sin(p.d)*.25; if(p.y>H){p.y=-4;p.x=Math.random()*W}
    x.globalAlpha=.6; x.fillStyle=p.c; x.fillRect(p.x,p.y,p.r,p.r*1.7); });
  requestAnimationFrame(tick);
})();
</script>
